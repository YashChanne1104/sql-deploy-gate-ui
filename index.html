<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log in — SQL Deploy Gate</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <div class="topbar">
        <a href="index.html" class="brand"><span class="gate-dot"></span> SQL DEPLOY GATE</a>
        <nav>
            <a href="signup.html">Sign up</a>
        </nav>
    </div>

    <div class="center-wrap">
        <div class="auth-card">
            <h1>Log in</h1>
            <p class="subtitle">Sign in to submit or review SQL changes.</p>

            <div id="formError"></div>

            <form id="loginForm">
                <div class="field">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" required autocomplete="username">
                </div>
                <div class="field">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" required autocomplete="current-password">
                </div>
                <button type="submit" class="btn btn-block" id="loginBtn">Log in</button>
            </form>

            <div class="auth-footer">
                Don't have an account? <a href="signup.html">Sign up</a>
            </div>
        </div>
    </div>

    <script src="js/api.js"></script>
    <script src="js/models/AuthModel.js"></script>
    <script src="js/controllers/LoginController.js"></script>
</body>

</html>
