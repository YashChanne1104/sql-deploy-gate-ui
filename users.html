<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Users — SQL Deploy Gate</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <div class="topbar">
        <a href="dashboard.html" class="brand"><span class="gate-dot"></span> SQL DEPLOY GATE</a>
        <div class="topbar-right">
            <nav id="navLinks"></nav>
            <div class="user-chip">
                <span class="user-email" id="userEmail"></span>
                <span id="roleTag"></span>
                <a href="#" id="logoutBtn" class="logout-link">Log out</a>
            </div>
        </div>
    </div>

    <div class="dash-wrap" style="max-width:800px;">
        <div class="repo-card-head" style="margin-bottom:4px;">
            <h1 style="font-size:19px;">Users</h1>
        </div>
        <p style="margin-bottom:0;">Assign the Developer, Approver, or Admin role to any account.</p>

        <div id="usersStats"></div>
        <div class="users-toolbar">
            <input type="text" id="usersSearch" class="users-search" placeholder="Search by email...">
        </div>
        <div id="usersMessage"></div>
        <div id="usersList"></div>
    </div>

    <script src="js/api.js"></script>
    <script src="js/models/AuthModel.js"></script>
    <script src="js/models/UserModel.js"></script>
    <script src="js/views/NavView.js"></script>
    <script src="js/views/UsersView.js"></script>
    <script src="js/views/ModalView.js"></script>
    <script src="js/controllers/PageShell.js"></script>
    <script src="js/controllers/UsersController.js"></script>
</body>

</html>
