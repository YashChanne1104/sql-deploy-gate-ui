<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Submissions — SQL Deploy Gate</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <div class="topbar">
        <a href="dashboard.html" class="brand"><span class="gate-dot"></span> SQL DEPLOY GATE</a>
        <div class="topbar-right">
            <nav id="navLinks"></nav>
            <div class="user-chip">
                <span class="user-email" id="userEmail"></span>
                <span id="roleTag"></span>
                <a href="#" id="logoutBtn" class="logout-link">Log out</a>
            </div>
        </div>
    </div>

    <div class="dash-wrap" style="max-width:800px;">
        <div class="repo-card">
            <div class="repo-card-head">
                <h1>Push a change</h1>
            </div>
            <p>Paste a stored procedure, function, trigger, or data change. It's classified and AI-reviewed the moment
                it lands.</p>

            <form id="pushForm">
                <div class="field">
                    <textarea id="sqlText" name="sqlText" placeholder="-- paste your SQL here" required></textarea>
                </div>
                <button type="submit" class="btn" id="pushBtn">Push for review</button>
            </form>

            <div id="pushResult"></div>
        </div>
    </div>

    <div id="loading-overlay" class="loading-overlay">
        <div class="loading-box">
            <div class="spinner"></div>
            <p>Analyzing your code...</p>
        </div>
    </div>

    <script src="js/api.js"></script>
    <script src="js/models/authmodel.js"></script>
    <script src="js/models/submissionmodel.js"></script>
    <script src="js/views/navview.js"></script>
    <script src="js/views/submissionsview.js"></script>
    <script src="js/controllers/pageshell.js"></script>
    <script src="js/controllers/submissionscontroller.js"></script>
</body>

</html>
